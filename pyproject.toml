[project]
name = "kitchen-critical-path"
version = "0.1.0"
description = "A critical-path planner for cooking: watches what happened, tracks dependencies and quality windows, and recommends the next best task."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
train = ["torch>=2.4", "torchvision", "timm>=1.0", "av>=12", "numpy>=1.26", "scikit-learn>=1.4"]
edge = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]

[project.scripts]
kcp = "kcp.cli:main"
kcp-train = "kcp.perception.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["kcp"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["av", "av.*", "timm", "timm.*", "sklearn", "sklearn.*", "torchvision", "torchvision.*", "onnxruntime", "onnxruntime.*", "tensorrt", "cv2"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
